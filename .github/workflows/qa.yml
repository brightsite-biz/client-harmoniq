name: QA
on: [push, pull_request]
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
        env:
          # The template itself ships with example content. Real client repos must remove this line.
          QA_ALLOW_TEMPLATE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-screenshots
          path: qa-screenshots
